# Lab 1: the image tag does not exist. Expect ErrImagePull -> ImagePullBackOff.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard-broken-image
  namespace: taskboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broken-image
  template:
    metadata:
      labels:
        app: broken-image
    spec:
      containers:
        - name: backend
          image: ghcr.io/example/taskboard-backend:does-not-exist
          ports:
            - containerPort: 8000
