apiVersion: v1
kind: Service
metadata:
  name: {{ include "taskboard.backendName" . }}
  labels:
    app: taskboard-backend
    {{- include "taskboard.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: taskboard-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
