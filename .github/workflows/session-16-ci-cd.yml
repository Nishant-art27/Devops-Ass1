name: Session 16 CI/CD Pipeline

# The project lives in session-16-cicd/, but GitHub only reads workflows from the repo root.
on:
  push:
    branches: [main]
    paths:
      - "session-16-cicd/**"
      - ".github/workflows/session-16-ci-cd.yml"
  pull_request:
    branches: [main]
    paths:
      - "session-16-cicd/**"
      - ".github/workflows/session-16-ci-cd.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: session-16-cicd

jobs:
  # ---------------- CI ----------------
  test:
    name: Test Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -v

  build:
    name: Build Application
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh
      - name: Show build info
        run: cat build/build-info.txt
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-build
          path: session-16-cicd/build/

  security-check:
    name: Security Check
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if sensitive files are committed
        run: |
          if find . -type f \( -name ".env" -o -name "*.pem" -o -name "*.key" \) | grep -q .; then
            echo "Sensitive file found"; exit 1
          fi
          echo "No .env, .pem or .key files in the project"
      - name: Confirm the demo secret is available (value is never printed)
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          if [ -n "$DEMO_SECRET" ]; then echo "DEMO_SECRET is configured, ${#DEMO_SECRET} characters"; else echo "DEMO_SECRET is not configured"; fi

  # ---------------- CD ----------------
  deliver:
    name: Deliver Docker Image
    needs: [build, security-check]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/session16-calculator
          tags: |
            type=sha
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: session-16-cicd
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Summary
        run: echo "Published ${{ steps.meta.outputs.tags }}" | tee -a "$GITHUB_STEP_SUMMARY"
