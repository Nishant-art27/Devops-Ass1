# Full local stack: PostgreSQL + FastAPI backend + React/nginx frontend.
#   docker compose up --build        then open http://localhost:3000 (UI) and http://localhost:8000/docs (API)
#   docker compose down -v           stops everything and deletes the database volume
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskboard
      POSTGRES_USER: taskboard
      POSTGRES_PASSWORD: taskboard
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskboard -d taskboard"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    image: taskboard-backend:local
    environment:
      DATABASE_URL: postgresql+psycopg://taskboard:taskboard@postgres:5432/taskboard
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  frontend:
    build: ./frontend
    image: taskboard-frontend:local
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: "8000"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:8080"

volumes:
  postgres-data:
