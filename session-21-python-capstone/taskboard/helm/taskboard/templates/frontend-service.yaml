apiVersion: v1
kind: Service
metadata:
  name: {{ include "taskboard.frontendName" . }}
  labels:
    app: taskboard-frontend
    {{- include "taskboard.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: taskboard-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
