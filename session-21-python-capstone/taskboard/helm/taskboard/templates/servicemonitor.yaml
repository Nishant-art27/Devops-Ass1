{{- if .Values.monitoring.serviceMonitor.enabled }}
# Tells the Prometheus Operator (kube-prometheus-stack) to scrape the backend Service on /metrics.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "taskboard.backendName" . }}
  labels:
    app: taskboard-backend
    release: {{ .Values.monitoring.serviceMonitor.release }}
    {{- include "taskboard.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: taskboard-backend
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
{{- end }}
