# Session 21 - TaskBoard CI/CD
# TEST  ->  BUILD + SECURITY SCAN + PUSH  ->  DEPLOY
# Workflows must live in .github/workflows at the repository root, so this file drives the
# project that lives in session-21-python-capstone/taskboard/.
name: Session 21 TaskBoard CI/CD

on:
  push:
    branches: [main]
    paths:
      - "session-21-python-capstone/taskboard/**"
      - ".github/workflows/session21-taskboard-ci-cd.yml"
  pull_request:
    branches: [main]
    paths:
      - "session-21-python-capstone/taskboard/**"
      - ".github/workflows/session21-taskboard-ci-cd.yml"
  workflow_dispatch:

env:
  PROJECT_DIR: session-21-python-capstone/taskboard

defaults:
  run:
    working-directory: session-21-python-capstone/taskboard

jobs:
  # ---------------------------------------------------------------- TEST
  test:
    name: Test (pytest + frontend build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: session-21-python-capstone/taskboard/backend/requirements.txt

      - name: Install backend dependencies
        working-directory: session-21-python-capstone/taskboard/backend
        run: pip install -r requirements.txt

      - name: Run pytest (first quality gate - a failure stops the pipeline here)
        working-directory: session-21-python-capstone/taskboard/backend
        run: pytest -v

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: session-21-python-capstone/taskboard/frontend/package-lock.json

      - name: Build React frontend
        working-directory: session-21-python-capstone/taskboard/frontend
        run: |
          npm ci
          npm run build

  # ------------------------------------------- BUILD + SECURITY SCAN + PUSH
  build-scan-push:
    name: Build, Trivy scan, push to GHCR
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR requires lower-case image names; the repository owner is "Nishant-art27".
      - name: Compute image names (tag = commit SHA, never "latest")
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "BACKEND_IMAGE=ghcr.io/${OWNER}/taskboard-backend:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/${OWNER}/taskboard-frontend:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build backend image
        run: docker build -t "$BACKEND_IMAGE" ./backend

      - name: Build frontend image (multi-stage)
        run: docker build -t "$FRONTEND_IMAGE" ./frontend

      - name: Trivy scan - backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}
          format: table
          output: ${{ github.workspace }}/trivy-backend.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy scan - frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}
          format: table
          output: ${{ github.workspace }}/trivy-frontend.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Logs are only visible to signed-in users; the run summary is public.
      # Runs even when a scan fails, so findings are visible as well.
      - name: Publish the Trivy tables to the run summary
        if: always()
        run: |
          for c in backend frontend; do
            f="$GITHUB_WORKSPACE/trivy-$c.txt"
            [ -f "$f" ] || continue
            cat "$f"
            {
              echo "### Trivy: $c image (HIGH and CRITICAL, fixable only)"
              echo '```'
              cat "$f"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images (only after tests and scans passed)
        if: github.event_name != 'pull_request'
        run: |
          docker push "$BACKEND_IMAGE"
          docker push "$FRONTEND_IMAGE"
          echo "### Images pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "- $BACKEND_IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "- $FRONTEND_IMAGE" >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------- DEPLOY
  deploy:
    name: Deploy with Helm
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build-scan-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Configure kubectl from the KUBE_CONFIG_DATA secret
        id: kubeconfig
        run: |
          if [ -z "$KUBE_CONFIG_DATA" ]; then
            echo "KUBE_CONFIG_DATA secret is not set (no reachable cluster from GitHub) - skipping the deploy job."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: helm upgrade --install (image tag = this commit)
        if: steps.kubeconfig.outputs.available == 'true'
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          helm upgrade --install taskboard ./helm/taskboard \
            --namespace taskboard --create-namespace \
            --set backend.image="ghcr.io/${OWNER}/taskboard-backend" \
            --set backend.tag="${GITHUB_SHA}" \
            --set frontend.image="ghcr.io/${OWNER}/taskboard-frontend" \
            --set frontend.tag="${GITHUB_SHA}" \
            --wait --timeout 5m
          kubectl get pods -n taskboard
