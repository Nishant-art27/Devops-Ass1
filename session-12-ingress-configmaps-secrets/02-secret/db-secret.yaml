# Database credentials. Base64 is encoding, not encryption.
apiVersion: v1
kind: Secret
metadata:
  name: nishantapp-db-secret
  labels:
    app: nishantapp
    owner: nishant
type: Opaque
data:
  # values are base64 of nishant_admin / Nishant@Secret1, encoded with printf (no trailing newline)
  POSTGRES_USER: bmlzaGFudF9hZG1pbg==
  POSTGRES_PASSWORD: TmlzaGFudEBTZWNyZXQx
