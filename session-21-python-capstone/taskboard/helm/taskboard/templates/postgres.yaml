# Classroom PostgreSQL inside the cluster, backed by a PersistentVolumeClaim.
# In production on AWS you would point DATABASE_URL at Amazon RDS instead and delete this file.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taskboard.postgresName" . }}
  labels:
    app: taskboard-postgres
    {{- include "taskboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.postgres.username | quote }}
  password: {{ .Values.postgres.password | quote }}
  database_url: "postgresql+psycopg://{{ .Values.postgres.username }}:{{ .Values.postgres.password }}@{{ include "taskboard.postgresName" . }}:5432/{{ .Values.postgres.database }}"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "taskboard.postgresName" . }}-data
  labels:
    app: taskboard-postgres
    {{- include "taskboard.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "taskboard.postgresName" . }}
  labels:
    app: taskboard-postgres
    {{- include "taskboard.labels" . | nindent 4 }}
spec:
  selector:
    app: taskboard-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taskboard.postgresName" . }}
  labels:
    app: taskboard-postgres
    {{- include "taskboard.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: taskboard-postgres
  template:
    metadata:
      labels:
        app: taskboard-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "taskboard.postgresName" . }}
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "taskboard.postgresName" . }}
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "taskboard.postgresName" . }}-data
